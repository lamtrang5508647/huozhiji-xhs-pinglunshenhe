name: Cross-platform audit regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline regressions
        run: python tests/run_regressions.py
      - name: Check syntax
        run: |
          node --check skills/comment-review-audit/scripts/build_audited_workbook.mjs
      - name: Check optional POSIX integration syntax
        if: runner.os != 'Windows'
        run: |
          bash -n skills/comment-review-audit/scripts/sync_openclaw_skill.sh
      - name: Test installed wheel outside checkout
        run: |
          python -m pip wheel . --no-deps -w dist
          python tests/wheel_smoke.py
      - name: Install live dependencies and smoke test real Chrome (no login)
        run: |
          python -m pip install ".[xhs]"
          python tests/browser_smoke.py
      - name: Test Windows installer and launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\tools\install-windows.ps1 -Python (Get-Command python).Source
          & .\tools\huozhiji-audit.ps1 review --expected examples/expected.json --observations examples/observations.json
