[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huozhiji-xhs-pinglunshenhe"
version = "0.3.0"
description = "Portable, evidence-based Xiaohongshu and Douyin comment audit toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
xhs = ["playwright>=1.45,<2", "xhs-cli==0.1.4"]

[project.scripts]
huozhiji-audit = "huozhiji_audit.cli:main"

[project.urls]
Repository = "https://github.com/lamtrang5508647/huozhiji-xhs-pinglunshenhe"

[tool.setuptools]
packages = ["huozhiji_audit", "huozhiji_audit._engine"]
package-dir = { "huozhiji_audit._engine" = "skills/comment-review-audit/scripts" }

[tool.setuptools.package-data]
"huozhiji_audit._engine" = ["*.mjs", "*.sh"]
